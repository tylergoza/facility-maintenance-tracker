# Tests and builds the Linux binary on this machine, then installs it, the
# systemd unit and its Caddy site on every droplet tagged do_tag. The database
# is backed up first whenever the binary changes (migrations run on start).
#
#   export DIGITALOCEAN_TOKEN=...
#   ansible-playbook deploy.yml             # or `make deploy` from the repo root
#
# To roll back, check out the previous commit and deploy it. If its
# migrations changed the database, restore the pre-deploy backup as well
# (README: Moving between hosts).

- name: Build
  hosts: localhost
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
  tasks:
    - name: Check the SSO settings
      ansible.builtin.assert:
        that: not sso_url or sso_client_secret | length > 0
        fail_msg: >-
          sso_url is set but the client secret is empty. Run
          `export UM_TRACKER_SECRET=...` with the secret User Management's
          import-users playbook printed, or unset sso_url to deploy without SSO.
        quiet: true

    - name: Run the tests
      ansible.builtin.command:
        cmd: make test
        chdir: "{{ repo_root }}"
      when: not skip_tests | bool
      changed_when: false

    - name: Build the binary
      ansible.builtin.command:
        cmd: make build-linux
        chdir: "{{ repo_root }}"
      changed_when: true

    - name: Find the droplets
      ansible.builtin.include_tasks: tasks/find_droplets.yml

    - name: Check there's somewhere to deploy to
      ansible.builtin.assert:
        that: groups['app'] | default([]) | length > 0
        fail_msg: No droplets are tagged {{ do_tag }}. Run provision.yml first.
        quiet: true

- name: Install
  hosts: app
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    binary: "{{ playbook_dir | dirname | dirname }}/bin/maintenance-tracker-linux-amd64"
    # Commands run as the service user so the files they write stay its own.
    # runuser rather than become: Ubuntu 26.04's default sudo is sudo-rs.
    tracker: [runuser, -u, maintenance, --, /usr/local/bin/maintenance-tracker, -db, "{{ app_db }}"]
  handlers:
    - name: Restart the app
      ansible.builtin.systemd_service:
        name: maintenance-tracker
        state: restarted
        daemon_reload: true

    - name: Reload Caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded
  tasks:
    - name: Checksum the new binary
      ansible.builtin.stat:
        path: "{{ binary }}"
      delegate_to: localhost
      register: new_binary

    - name: Checksum the installed binary
      ansible.builtin.stat:
        path: /usr/local/bin/maintenance-tracker
      register: old_binary

    - name: Check for a database
      ansible.builtin.stat:
        path: "{{ app_db }}"
      register: db

    - name: Back up the database
      ansible.builtin.command:
        argv: "{{ tracker + ['backup', app_backup_dir ~ '/pre-deploy-' ~ now(utc=true, fmt='%Y%m%dT%H%M%SZ') ~ '.db'] }}"
      when: db.stat.exists and old_binary.stat.checksum | default('') != new_binary.stat.checksum
      changed_when: true

    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ binary }}"
        dest: /usr/local/bin/maintenance-tracker
        mode: "0755"
      notify: Restart the app

    - name: Install the systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../maintenance-tracker.service"
        dest: /etc/systemd/system/maintenance-tracker.service
        mode: "0644"
      notify: Restart the app

    - name: Create the unit's drop-in folder
      ansible.builtin.file:
        path: /etc/systemd/system/maintenance-tracker.service.d
        state: directory
        mode: "0755"

    # The unit in the repo has a placeholder TZ; this overrides it. The SSO
    # lines are only written when sso_url is set, so unsetting it and
    # redeploying turns SSO off. The file holds the client secret, hence
    # root-only and no_log.
    - name: Set the time zone and single sign-on
      ansible.builtin.copy:
        content: |
          [Service]
          Environment=TZ={{ tz }}
          {% if sso_url %}
          Environment=SSO_URL={{ sso_url }}
          Environment=SSO_INTERNAL_URL={{ sso_internal_url }}
          Environment=SSO_CLIENT_ID={{ sso_client_id }}
          Environment=SSO_CLIENT_SECRET={{ sso_client_secret }}
          {% endif %}
          {% if base_url %}
          Environment=BASE_URL={{ base_url }}
          {% endif %}
        dest: /etc/systemd/system/maintenance-tracker.service.d/override.conf
        mode: "0600"
      no_log: true
      notify: Restart the app

    # The droplet can be shared with the production planner: each app puts
    # its own site in /etc/caddy/sites/ and the main Caddyfile (the same in
    # both repos) imports them all.
    - name: Create the Caddy sites folder
      ansible.builtin.file:
        path: /etc/caddy/sites
        state: directory
        mode: "0755"

    # Before the main file, so its import never finds an empty folder.
    - name: Install this app's Caddy site
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/sites/maintenance-tracker.caddy
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s
      notify: Reload Caddy

    - name: Install the main Caddyfile
      ansible.builtin.copy:
        content: |
          # Managed by deploy/ansible in each app's repo; edits here are overwritten.
          # Each app puts its own site in /etc/caddy/sites/.
          import /etc/caddy/sites/*.caddy
        dest: /etc/caddy/Caddyfile
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s
      notify: Reload Caddy

    # Before the app first starts, so /setup is never reachable.
    - name: Create the admin user
      when: not db.stat.exists
      vars:
        password: "{{ admin_password or lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      block:
        - name: Pick the admin password
          ansible.builtin.set_fact:
            new_admin_password: "{{ password }}"
          no_log: true

        - name: Create {{ admin_username }}
          ansible.builtin.command:
            argv: "{{ tracker + ['create-user', admin_username, '--admin'] }}"
            stdin: "{{ new_admin_password }}"
          no_log: true
          changed_when: true

    - name: Start the app
      ansible.builtin.systemd_service:
        name: maintenance-tracker
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply restarts and reloads
      ansible.builtin.meta: flush_handlers

    - name: Wait for the app to answer
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
      register: health
      until: health.status == 200
      retries: 15
      delay: 2

    - name: Find old pre-deploy backups
      ansible.builtin.find:
        paths: "{{ app_backup_dir }}"
        patterns: pre-deploy-*.db
      register: backups

    - name: Remove all but the newest {{ keep_backups }}
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (backups.files | sort(attribute='mtime', reverse=true))[keep_backups | int :] }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ 'Running at https://' ~ app_domain ~ '. Sign in as ' ~ admin_username ~ ' with password '
             ~ new_admin_password ~ ', change it, and set Settings → Site address to https://' ~ app_domain ~ '.'
             if new_admin_password is defined else 'Deployed to https://' ~ app_domain ~ '.' }}
