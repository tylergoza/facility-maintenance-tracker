# Tests and builds the Linux binary on this machine, installs it and the systemd
# unit on every droplet tagged do_tag, then writes this app's Caddy site on the
# edge box(es). The database (and secrets.key beside it) is backed up first
# whenever the binary changes (migrations run on start).
#
#   with-do-church make deploy              # or ansible-playbook deploy.yml here
#
# With -e restore_pending=true the binary and unit go in but the app isn't
# started and no admin is made, so `make restore` finds no database.
#
# To roll back, check out the previous commit and deploy it. If its
# migrations changed the database, restore the pre-deploy backup as well
# (README: Moving between hosts).

- name: Build
  hosts: localhost
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
  tasks:
    - name: Check the SSO settings
      ansible.builtin.assert:
        that: not sso_url or sso_client_secret | length > 0
        fail_msg: >-
          sso_url is set but the client secret is empty. Run
          `export UM_TRACKER_SECRET=...` with the secret User Management's
          import-users playbook printed, or unset sso_url to deploy without SSO.
        quiet: true

    - name: Check the calendar settings
      ansible.builtin.assert:
        that: not calendar_url or calendar_token | length > 0
        fail_msg: >-
          calendar_url is set but the token is empty. Run
          `export MT_CALENDAR_TOKEN=cal_...` with a read token made in the
          calendar, or unset calendar_url and connect it on /admin/connections.
        quiet: true

    - name: Check the account
      ansible.builtin.include_tasks: tasks/check_account.yml

    - name: Find the droplets
      ansible.builtin.include_tasks: tasks/find_droplets.yml

    - name: Check there's somewhere to deploy to
      ansible.builtin.assert:
        that: groups['app'] | default([]) | length > 0
        fail_msg: No droplets are tagged {{ do_tag }}. Run provision.yml first.
        quiet: true

    - name: Check there's an edge box to route through
      ansible.builtin.assert:
        that: groups['edge'] | default([]) | length > 0
        fail_msg: >-
          No droplet is tagged {{ edge_tag }}, so nothing would serve {{ app_domain }}.
          Provision the edge box first (edge_proxy: make provision).
        quiet: true

    - name: Check the app box has a VPC address
      ansible.builtin.assert:
        that: hostvars[groups['app'][0]].private_ip | length > 0
        fail_msg: "{{ groups['app'][0] }} has no private (VPC) address, which the app binds to."
        quiet: true

    - name: Run the tests
      ansible.builtin.command:
        cmd: make test
        chdir: "{{ repo_root }}"
      when: not skip_tests | bool
      changed_when: false

    - name: Build the binary
      ansible.builtin.command:
        cmd: make build-linux
        chdir: "{{ repo_root }}"
      changed_when: true

- name: Install
  hosts: app
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    binary: "{{ playbook_dir | dirname | dirname }}/bin/maintenance-tracker-linux-amd64"
    # Commands run as the service user so the files they write stay its own.
    # runuser rather than become: Ubuntu 26.04's default sudo is sudo-rs.
    tracker: [runuser, -u, maintenance, --, /usr/local/bin/maintenance-tracker, -db, "{{ app_db }}"]
  handlers:
    # Not while a restore is pending: the app mustn't start and make an empty database.
    - name: Restart the app
      ansible.builtin.systemd_service:
        name: maintenance-tracker
        state: restarted
        daemon_reload: true
      when: not restore_pending | bool
  tasks:
    - name: Checksum the new binary
      ansible.builtin.stat:
        path: "{{ binary }}"
      delegate_to: localhost
      register: new_binary

    - name: Checksum the installed binary
      ansible.builtin.stat:
        path: /usr/local/bin/maintenance-tracker
      register: old_binary

    - name: Check for a database
      ansible.builtin.stat:
        path: "{{ app_db }}"
      register: db

    # secrets.key encrypts the saved secrets; it sits beside the database and is
    # backed up with it (the app creates it on first start, so it may be missing).
    - name: Check for the secrets key
      ansible.builtin.stat:
        path: "{{ app_data_dir }}/secrets.key"
      register: secrets_key

    - name: Decide whether to back up
      ansible.builtin.set_fact:
        needs_backup: "{{ db.stat.exists and old_binary.stat.checksum | default('') != new_binary.stat.checksum }}"

    # One stem for both files, so a backup is always the .db and its .key together.
    - name: Name the pre-deploy backup
      ansible.builtin.set_fact:
        backup_stem: "{{ app_backup_dir ~ '/pre-deploy-' ~ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"
      when: needs_backup

    - name: Back up the database
      ansible.builtin.command:
        argv: "{{ tracker + ['backup', backup_stem ~ '.db'] }}"
      when: needs_backup
      changed_when: true

    - name: Back up the secrets key
      ansible.builtin.copy:
        src: "{{ app_data_dir }}/secrets.key"
        dest: "{{ backup_stem ~ '.key' }}"
        remote_src: true
        owner: maintenance
        group: maintenance
        mode: "0600"
      when: needs_backup and secrets_key.stat.exists

    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ binary }}"
        dest: /usr/local/bin/maintenance-tracker
        mode: "0755"
      notify: Restart the app

    - name: Install the systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../maintenance-tracker.service"
        dest: /etc/systemd/system/maintenance-tracker.service
        mode: "0644"
      notify: Restart the app

    - name: Create the unit's drop-in folder
      ansible.builtin.file:
        path: /etc/systemd/system/maintenance-tracker.service.d
        state: directory
        mode: "0755"

    # The unit in the repo has a placeholder TZ and listens on loopback; this
    # overrides both (ADDR is the box's VPC address, where the edge box's Caddy
    # reaches it). Each
    # connection goes here when it's set, which locks it in the app's
    # Connections page. Blank means the app's saved settings are used, so
    # unset a value and redeploy to hand it back to the app (after Keep in
    # settings). The SSO lines, BASE_URL included, are only written when
    # sso_url is set: any one of them alone would take the whole connection
    # out of the app's hands. The file holds the client secret and token,
    # hence root-only and no_log.
    - name: Set the time zone and the connections (single sign-on, calendar)
      ansible.builtin.copy:
        content: |
          [Service]
          Environment=ADDR={{ private_ip }}:{{ app_port }}
          Environment=TZ={{ tz }}
          {% if old_site_urls %}
          Environment=OLD_SITE_URLS={{ old_site_urls }}
          {% endif %}
          {% if sso_url %}
          Environment=SSO_URL={{ sso_url }}
          Environment=SSO_INTERNAL_URL={{ sso_internal_url }}
          Environment=SSO_CLIENT_ID={{ sso_client_id }}
          Environment=SSO_CLIENT_SECRET={{ sso_client_secret }}
          {% if base_url %}
          Environment=BASE_URL={{ base_url }}
          {% endif %}
          {% endif %}
          {% if calendar_url %}
          Environment=CALENDAR_URL={{ calendar_url }}
          {% endif %}
          {% if calendar_internal_url %}
          Environment=CALENDAR_INTERNAL_URL={{ calendar_internal_url }}
          {% endif %}
          {% if calendar_token %}
          Environment=CALENDAR_TOKEN={{ calendar_token }}
          {% endif %}
        dest: /etc/systemd/system/maintenance-tracker.service.d/override.conf
        mode: "0600"
      no_log: true
      notify: Restart the app

    # Before the app first starts, so /setup is never reachable.
    - name: Create the admin user
      when: not db.stat.exists and not restore_pending | bool
      vars:
        password: "{{ admin_password or lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      block:
        - name: Pick the admin password
          ansible.builtin.set_fact:
            new_admin_password: "{{ password }}"
          no_log: true

        - name: Create {{ admin_username }}
          ansible.builtin.command:
            argv: "{{ tracker + ['create-user', admin_username, '--admin'] }}"
            stdin: "{{ new_admin_password }}"
          no_log: true
          changed_when: true

    # The restore starts it, once the database is in place.
    - name: Let systemd see the new unit
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: restore_pending | bool

    - name: Start the app
      ansible.builtin.systemd_service:
        name: maintenance-tracker
        enabled: true
        state: started
        daemon_reload: true
      when: not restore_pending | bool

    - name: Apply restarts
      ansible.builtin.meta: flush_handlers

    - name: Wait for the app to answer
      ansible.builtin.uri:
        url: http://{{ private_ip }}:{{ app_port }}/healthz
      register: health
      until: health.status == 200
      retries: 15
      delay: 2
      when: not restore_pending | bool

    - name: Find old pre-deploy backups
      ansible.builtin.find:
        paths: "{{ app_backup_dir }}"
        patterns: ["pre-deploy-*.db", "pre-deploy-*.key"]
      register: backups

    # A backup is its .db and .key together: keep the newest {{ keep_backups }} .db
    # files and every .key that goes with one of them. Anything else goes.
    - name: Remove all but the newest {{ keep_backups }}
      vars:
        newest_stems: "{{ (backups.files | selectattr('path', 'match', '.*\\.db$') | sort(attribute='mtime', reverse=true) | map(attribute='path') | map('regex_replace', '\\.db$', '') | list)[:keep_backups | int] }}"
        kept_paths: "{{ (newest_stems | map('regex_replace', '$', '.db') | list) + (newest_stems | map('regex_replace', '$', '.key') | list) }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ backups.files | map(attribute='path') | difference(kept_paths) }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ 'Installed, not started: run make restore next.' if restore_pending | bool else
             'Running at https://' ~ app_domain ~ '. Sign in as ' ~ admin_username ~ ' with password '
             ~ new_admin_password ~ ', change it, and set Settings → Site address to https://' ~ app_domain ~ '.'
             if new_admin_password is defined else 'Deployed to https://' ~ app_domain ~ '.' }}

# Each app owns its route: the edge box(es) get this app's site file, then
# Caddy reloads. With two edge boxes both are written.
- name: Route the domain through the edge box
  hosts: edge
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  tasks:
    - name: Create the Caddy sites folder
      ansible.builtin.file:
        path: /etc/caddy/sites
        state: directory
        mode: "0755"

    - name: Install this app's Caddy site
      ansible.builtin.template:
        src: site.caddy.j2
        dest: /etc/caddy/sites/maintenance-tracker.caddy
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s

    - name: Reload Caddy
      ansible.builtin.include_tasks: tasks/caddy_reload.yml
