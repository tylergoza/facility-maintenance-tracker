{{define "content"}}
<div class="page-head"><div><h1>{{.Title}}</h1></div></div>
<div class="card narrow">
  {{template "errors" .Errors}}
  {{if not .Buildings}}
    <p>You need to <a href="/buildings/new">add a building</a> before adding rooms.</p>
  {{else}}
  <form method="post" action="{{if .Form.ID}}/rooms/{{.Form.ID}}{{else}}/rooms{{end}}" class="form">
    {{template "csrf" .CSRF}}
    <div class="field">
      <label for="building_id">Building</label>
      <select id="building_id" name="building_id" required>
        <option value="">Choose…</option>
        {{range .Buildings}}<option value="{{.ID}}" {{if eq .ID $.Form.BuildingID}}selected{{end}}>{{.Name}}</option>{{end}}
      </select>
    </div>
    <div class="field">
      <label for="name">Room name</label>
      <input id="name" name="name" value="{{.Form.Name}}" required autofocus placeholder="e.g. Nursery, Kitchen, Classroom">
    </div>
    <div class="field">
      <label for="number">Room number <span class="optional">optional</span></label>
      <input id="number" name="number" value="{{.Form.Number}}" placeholder="e.g. 104, B12">
    </div>
    <div class="field">
      <label for="floor">Floor / area <span class="optional">optional</span></label>
      <input id="floor" name="floor" value="{{.Form.Floor}}" placeholder="e.g. Basement, 1st floor, East wing">
    </div>
    <div class="field">
      <label for="notes">Notes <span class="optional">optional</span></label>
      <textarea id="notes" name="notes" rows="3">{{.Form.Notes}}</textarea>
    </div>
    <div class="form__actions">
      <button type="submit" class="btn btn--primary">Save room</button>
      <a class="btn btn--ghost" href="{{if .Form.ID}}/rooms/{{.Form.ID}}{{else if .Form.BuildingID}}/buildings/{{.Form.BuildingID}}{{else}}/buildings{{end}}">Cancel</a>
    </div>
  </form>
  {{end}}
</div>
{{end}}
